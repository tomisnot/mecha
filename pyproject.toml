[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mecha"
version = "0.2.0"
description = "让 AI 深度接入自管理状态软件的协作框架与宿主集成"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
# dsh 宿主接线（Phase 5 第 2 步）才需要；库本体零依赖是纪律（独立于 dsh）。
# MCP 传输 Provider（``mecha.providers.mcp``）：核心**不 import** 它。
# - ``uvicorn`` 被直接 import（不是仅传递依赖）⇒ 必须显式声明；
# - ``MCPServer`` 与 ``_tool_manager.get_tool`` 是 mcp 2.2 的形状 ⇒ 下界 2.2、
#   上界 <3（SDK 私有面垫片只隔离在一个函数里，升级时只改那一处）。
mcp = ["mcp>=2.2,<3", "uvicorn>=0.30"]

[tool.setuptools.packages.find]
include = ["mecha*"]

# 只发库本体：examples/ 已退役（ADR 领域参考实现搬回所属项目）——EL 的领域实现
# （ElEngine/V2Bridge/tools/hub）住 EL 项目仓 `mecha_v2` 包，框架包不代管项目代码。
# D-23 教训的兑现方式随之改变：库 docstring/README 不再指向"包内示例文件"，
# 而是自包含最小例（README"怎么起"，实测可跑）+ 指向 EL 仓真表 docs/capabilities.md。

# D-24 教训：package-data 必须显式声明并真出包验证，读代码永远看不出来。
# 随包资产：`mecha/dsh_adapter/assets/` 是 **dsh 集成标准件**（TS/TSX，不是框架
# 能力——理由见该目录 README）。它不是 Python 包，故只能作为 `mecha` 包的
# **数据文件**随包分发。
# ⚠ `.tsx` 必须**单独列**：`*.ts` 不匹配 `.tsx` —— 面板壳（`MonitorTabBody.tsx`）
# 曾经因此不会随包发货，而出包核验（zipfile 逐名核对）才是唯一能发现它的地方。
# ⚠ **`package.json` 也必须单独列**：消费侧以
# `npm install file:<...>/mecha/dsh_adapter/assets` 经 junction 依赖本资产；
# 少了这个文件，**pip 装出来的 mecha 里就没有它** ⇒ 消费侧根本装不上。
# ⚠⚠ **子目录也必须单独列**：`dsh_adapter/assets/*.ts` 不匹配 `panel/`、`host/`、
# `host-plugin/` ⇒ 干净构建会只留下根目录文件，整套面板静默丢失。
# ⇒ 模式清单是唯一会被漏的地方，改完必须真出包核验。
[tool.setuptools.package-data]
mecha = [
    "dsh_adapter/assets/*.ts", "dsh_adapter/assets/*.tsx",
    "dsh_adapter/assets/*.md", "dsh_adapter/assets/*.json",
    "dsh_adapter/assets/*.yml",
    "dsh_adapter/assets/panel/*.ts", "dsh_adapter/assets/panel/*.tsx",
    "dsh_adapter/assets/panel/*.json",
    "dsh_adapter/assets/host/*.ts",
    "dsh_adapter/assets/host-plugin/*.mjs",
    "dsh_adapter/assets/host-plugin/*.mts",
    "dsh_adapter/assets/host-plugin/*.d.mts",
]

