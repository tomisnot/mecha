[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mecha"
version = "0.2.0"
description = "这台软件的操作者无关层：写入门 / 域状态史 / 能力面 / 人类监控面"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
# dsh 宿主接线（Phase 5 第 2 步）才需要；库本体零依赖是纪律（独立于 dsh）。
# MCP 传输 Provider（``mecha.providers.mcp``）：核心**不 import** 它。
# - ``uvicorn`` 被直接 import（不是仅传递依赖）⇒ 必须显式声明；
# - ``MCPServer`` 与 ``_tool_manager.get_tool`` 是 mcp 2.2 的形状 ⇒ 下界 2.2、
#   上界 <3（SDK 私有面垫片只隔离在一个函数里，升级时只改那一处）。
mcp = ["mcp>=2.2,<3", "uvicorn>=0.30"]

[tool.setuptools.packages.find]
include = ["mecha*"]

# 只发库本体：examples/ 已退役（ADR 领域参考实现搬回所属项目）——EL 的领域实现
# （ElEngine/V2Bridge/tools/hub）住 EL 项目仓 `mecha_v2` 包，框架包不代管项目代码。
# D-23 教训的兑现方式随之改变：库 docstring/README 不再指向"包内示例文件"，
# 而是自包含最小例（README"怎么起"，实测可跑）+ 指向 EL 仓真表 docs/capabilities.md。

# D-24 教训：package-data 必须显式声明并真出包验证，读代码永远看不出来。
# 当前 mecha/ 无随包资产；将来出厂 UI/资产进 cockpit 时在此声明并跑 pip wheel 验。
